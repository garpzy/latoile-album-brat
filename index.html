<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="discographie.css">
    <link rel="stylesheet" href="flip.css">
</head>
<body class="discographie-page">
    <header>
        <nav>
            <ul>
                <li><a href="merch.html">Merch</a></li>
                <li><a href="charli.html">Charli XCX</a></li>
                <li><a href="index.html">Discographie</a></li>
            </ul>
        </nav>
    </header>
    <main class="discographie">
        <section class="albums">
            <a href="brat.html" class="album-link">
                <div class="album flip-card" id="brat">
                    <div class="flip-card-inner">
                        <!-- Face Recto -->
                        <div class="flip-card-front">
                            <img src="assets/brat-cover.png" alt="Recto">
                        </div>
                        <!-- Face Verso -->
                        <div class="flip-card-back">
                            <img src="assets/brat-summer.png" alt="Verso">
                        </div>
                    </div>
                </div>  
            </a> 
            <a href="crash.html" class="album-link">
                <div class="album flip-card" id="crash">
                    <div class="flip-card-inner">
                        <!-- Face Recto -->
                        <div class="flip-card-front">
                            <img src="assets/crash-cover.jpg" alt="Recto">
                        </div>
                        <!-- Face Verso -->
                        <div class="flip-card-back">
                            <img src="assets/crash-charli.jpg" alt="Verso">
                        </div>
                    </div>
                </div>  
            </a>         
        </section>
    </main>

</html>
